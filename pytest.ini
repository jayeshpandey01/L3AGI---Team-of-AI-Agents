[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that require Docker/XAgent services
    slow: Tests that take longer to run
    xagent: Tests specifically for XAgent functionality
    react: Tests specifically for ReAct functionality
    mock: Tests that use mocks
    history: Tests for history mapping functionality
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
